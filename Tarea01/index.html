<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club de Objetos Perdidos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="header">
    <div class="logo-container">
      <img src="imagenes/flor.png" alt="Icono flor" class="icon-decor">
      <h1>Club de Objetos Perdidos</h1>
    </div>

    <nav class="nav">
      <ul>
        <li>
          <a href="#inicio" class="nav-btn">
            <img src="imagenes/inicio.png" alt=""> Inicio
          </a>
        </li>
        <li>
          <a href="#reportar" class="nav-btn">
            <img src="imagenes/reporte.png" alt=""> Publicar
          </a>
        </li>
        <!-- Barra de búsqueda integrada en la navegación -->
        <li>
          <form class="nav-search-form" action="#buscar">
            <input type="search" placeholder="Buscar..." aria-label="Buscar objeto">
            <button type="submit" class="nav-search-btn" title="Buscar">
              <img src="imagenes/lupa.png" alt="Buscar">
            </button>
          </form>
        </li>
      </ul>
    </nav>
  </header>

  <main id="inicio">

    <!-- Sección Hero / Buscador -->
    <section class="hero" id="buscar">
      <div class="hero-card">
        <h2>
          <img src="imagenes/osodepeluche.png" alt="" class="icon-titulo">
          ¿Perdiste o encontraste algo muy especial?
        </h2>
        <form class="buscador">
          <div class="campo-grupo">
            <label for="nombre-objeto">Nombre del objeto</label>
            <input type="search" id="nombre-objeto" placeholder="Escribe el nombre del objeto...">
          </div>

          <div class="campo-grupo">
            <label for="filtro-estado">Estado</label>
            <select id="filtro-estado">
              <option value="">Todos los estados</option>
              <option value="perdido">Perdido</option>
              <option value="encontrado">Encontrado</option>
              <option value="recuperado">Recuperado</option>
            </select>
          </div>

          <button type="submit" class="btn-primary">
            <img src="imagenes/lupa.png" alt=""> Buscar ✨
          </button>
        </form>
      </div>
    </section>

  </main>

</body>
</html>
